<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AudriArt Project Radar - Pencari Lowongan Ilustrasi</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0a0c10;
            --panel-bg: #12161f;
            --panel-border: #1e2638;
            --accent-purple: #7c3aed;
            --accent-purple-hover: #6d28d9;
            --accent-cyan: #06b6d4;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --card-bg: #181e2a;
            --card-hover: #1f2738;
            --green-price: #10b981;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            padding: 2rem 1rem;
            min-height: 100vh;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        header h1 {
            font-size: 2.2rem;
            font-weight: 800;
            background: linear-gradient(135deg, #a78bfa, #06b6d4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }

        header p {
            color: var(--text-muted);
            font-size: 1rem;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.5rem;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--panel-border);
            border-radius: 12px;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.2s, border-color 0.2s;
        }

        .card:hover {
            transform: translateY(-4px);
            border-color: var(--accent-purple);
        }

        .card-tag {
            align-self: flex-start;
            background: rgba(124, 58, 237, 0.15);
            color: #c084fc;
            padding: 0.3rem 0.8rem;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            margin-bottom: 1rem;
        }

        .card h3 {
            font-size: 1.1rem;
            line-height: 1.4;
            margin-bottom: 1rem;
            color: var(--text-main);
        }

        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 1rem;
            padding-top: 1rem;
            border-top: 1px solid var(--panel-border);
        }

        .source {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .btn {
            display: inline-block;
            background-color: var(--accent-purple);
            color: white;
            text-decoration: none;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 600;
            transition: background 0.2s;
        }

        .btn:hover {
            background-color: var(--accent-purple-hover);
        }

        .empty-state {
            text-align: center;
            grid-column: 1 / -1;
            padding: 3rem;
            color: var(--text-muted);
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>AudriArt Project Radar 📡</h1>
            <p>Pemindai Lowongan Ilustrasi & Komisi Seni Otomatis</p>
        </header>

        <div class="grid" id="jobs-container">
            <div class="empty-state">Sedang memuat lowongan terbaru...</div>
        </div>
    </div>

    <script>
        async function loadJobs() {
            const container = document.getElementById('jobs-container');
            try {
                // Mengambil data dari jobs.json yang digenerate otomatis oleh scraper.py
                const response = await fetch('jobs.json?t=' + new Date().getTime());
                if (!response.ok) throw new Error('File jobs.json belum ada');
                
                const jobs = await response.json();
                
                if (jobs.length === 0) {
                    container.innerHTML = '<div class="empty-state">Belum ada lowongan baru ditemukan pada pemindaian terakhir.</div>';
                    return;
                }

                container.innerHTML = jobs.map(job => `
                    <div class="card">
                        <div>
                            <div class="card-tag">${job.keyword || 'Lowongan'}</div>
                            <h3>${job.title}</h3>
                        </div>
                        <div class="card-footer">
                            <span class="source">${job.source}</span>
                            <a href="${job.url}" target="_blank" rel="noopener noreferrer" class="btn">Buka Lowongan ↗</a>
                        </div>
                    </div>
                `).join('');

            } catch (error) {
                console.log(error);
                container.innerHTML = `
                    <div class="empty-state">
                        <p>Belum ada data pemindaian otomatis terbaru.</p>
                        <p style="font-size: 0.85rem; margin-top: 0.5rem;">Robot akan membuat data pertama saat jadwal pemindaian berikutnya berjalan.</p>
                    </div>
                `;
            }
        }

        loadJobs();
    </script>
</body>
</html>
