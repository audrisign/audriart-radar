name: AudriArt Scraper Radar

on:
  schedule:
    - cron: '0 * * * *' # Berjalan otomatis setiap 1 jam
  workflow_dispatch: # Memungkinkan untuk dijalankan secara manual kapan saja

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Memberi izin bot untuk menyimpan jobs.json ke repository
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Scraper
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python scraper.py

      - name: Commit and Push jobs.json
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add jobs.json
          git commit -m "Auto-update jobs.json [skip ci]" || echo "Tidak ada perubahan data"
          git push
