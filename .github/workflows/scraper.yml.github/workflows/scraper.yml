name: AudriArt Job Radar Scraper

on:
  schedule:
    # Berjalan otomatis setiap 1 jam sekali (24/7)
    - cron: '0 * * * *'
  workflow_dispatch: # Memungkinkan kamu menjalankan manual kapan saja

jobs:
  scrape-and-notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install requests beautifulsoup4

      - name: Run Scraper Script
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python scraper.py
